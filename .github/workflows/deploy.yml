name: Deploy to Beget

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate application
        shell: bash
        run: |
          set -euo pipefail
          find admin api tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check assets/js/main.js
          node --check assets/js/video-player.js
          node --check assets/js/radio-player.js
          node --check assets/js/episodes.js
          test -f assets/video/hero-intro.mp4
          test -f uploads/.htaccess

      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via rsync
        shell: bash
        run: |
          rsync -az --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".gitignore" \
            --exclude="README.md" \
            --exclude="start-local.ps1" \
            --exclude="database/" \
            --exclude="tools/" \
            --exclude="admin/includes/config.php" \
            --exclude="uploads/episodes/" \
            --exclude="uploads/recipes/" \
            --exclude="originals/" \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}

      - name: Finish
        run: echo "Deployment completed successfully."
