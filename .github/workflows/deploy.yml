name: Deploy to Beget

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.BEGET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.BEGET_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy website
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "
            set -e
            cd '${{ secrets.BEGET_DEPLOY_PATH }}'
            git fetch origin main
            git reset --hard origin/main
          "