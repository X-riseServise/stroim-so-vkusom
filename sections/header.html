<header class="site-header" id="header" data-header>

    <a class="site-logo" href="#sections-root" aria-label="Строим со вкусом - на главную">
      <img class="site-logo__image" src="assets/images/brand/stroim-so-vkusom-logo.svg" alt="" width="1536" height="1024" decoding="async">
    </a>

    <nav class="site-nav" aria-label="Основная навигация">
      <a class="site-nav__link" href="#about">О проекте</a>

      <span class="visually-hidden" data-radio-status aria-live="polite">Радио выключено</span>

    <a class="site-header__cta" href="#latest-episode">
      <span>Смотреть выпуск</span>
      <span aria-hidden="true">→</span>
    </a>

    <button class="site-menu-toggle" type="button" aria-label="Открыть меню" aria-controls="mobile-navigation" aria-expanded="false" data-menu-toggle>
      <span class="site-menu-toggle__line"></span>
      <span class="site-menu-toggle__line"></span>
    </button>
  </div>

  <nav class="site-mobile-nav" id="mobile-navigation" aria-label="Мобильная навигация" aria-hidden="true" data-mobile-nav>
